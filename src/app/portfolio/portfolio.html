<section class="page-section fade-in">
  <div class="container py-5">
    <div class="text-center mb-5">
      <h2 class="display-6">Portfolio</h2>
      <p class="text-muted">A showcase of our best interior design work.</p>
    </div>

    <div class="row g-4">
      <div class="col-md-4" *ngFor="let item of [1,2,3]">
        <div class="card shadow-sm h-100 border-0 portfolio-card">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Project {{ item }}</h5>
            <p class="card-text">Modern spaces with clean lines, warm textures and thoughtful finishes.</p>
            <div class="mt-auto">
              <span class="badge bg-primary">Interior</span>
              <span class="badge bg-secondary">Design</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
