        <span class="brand-text"><strong>{{ clientConfig.shortName }}</strong> Interio</span>
      </div>
    </a>

      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="navbar-collapse d-none d-lg-flex align-items-center justify-content-end" id="mainNavbar">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/portfolio" routerLinkActive="active">Portfolio</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/services" routerLinkActive="active">Services</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/about" routerLinkActive="active">About Us</a></li>
      </ul>
      <div class="social-links d-flex align-items-center ms-3 mt-0">
        <a class="social-icon instagram" [href]="clientConfig.social.instagramUrl" target="_blank" rel="noopener" aria-label="Instagram">
          <img src="/instagram-logo.png" alt="Instagram" class="social-icon-img">
        </a>
        <a class="social-icon youtube" [href]="clientConfig.social.youtubeUrl" target="_blank" rel="noopener" aria-label="YouTube">
          <img src="/youtube.png" alt="YouTube" class="social-icon-img">

      </div>

<div class="offcanvas offcanvas-end text-bg-light" tabindex="-1" id="mainNavbarOffcanvas" aria-labelledby="mainNavbarOffcanvasLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="mainNavbarOffcanvasLabel">Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" data-bs-dismiss="offcanvas">Home</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/portfolio" routerLinkActive="active" data-bs-dismiss="offcanvas">Portfolio</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/services" routerLinkActive="active" data-bs-dismiss="offcanvas">Services</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/contact" routerLinkActive="active" data-bs-dismiss="offcanvas">Contact Us</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/about" routerLinkActive="active" data-bs-dismiss="offcanvas">About Us</a></li>
    </ul>
    <div class="social-links d-flex align-items-center mt-4">
      <a class="social-icon instagram" [href]="clientConfig.social.instagramUrl" target="_blank" rel="noopener" aria-label="Instagram">
        <i class="fab fa-instagram" aria-hidden="true"></i>
      </a>
      <a class="social-icon youtube" [href]="clientConfig.social.youtubeUrl" target="_blank" rel="noopener" aria-label="YouTube">
        <i class="fab fa-youtube" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</div>

<main class="page">
  <div class="container mt-5 pt-5">
    <div class="route-shell">
      <router-outlet></router-outlet>
    </div>
  </div>
</main>

<a class="whatsapp-fab" [href]="'https://wa.me/' + clientConfig.contact.whatsappNumber" target="_blank" rel="noopener" aria-label="WhatsApp chat">
  <img src="/whatsapp.png" alt="WhatsApp" class="whatsapp-icon">
</a>
