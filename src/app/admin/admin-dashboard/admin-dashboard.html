<section class="page-section fade-in admin-dashboard-section">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="h4 mb-0">Admin Dashboard</h2>
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="logout()">Logout</button>
    </div>

    <ul class="nav nav-tabs mb-4">
      <li class="nav-item" *ngFor="let tab of tabs">
        <button
          type="button"
          class="nav-link"
          [class.active]="activeTab() === tab.id"
          (click)="activeTab.set(tab.id)"
        >{{ tab.label }}</button>
      </li>
    </ul>

    <div class="tab-content">
      <app-quotation *ngIf="activeTab() === 'quotation'"></app-quotation>
    </div>
  </div>
</section>
