<div class="revised-quotation-wrapper">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Revised Quotation</h5>
        <button type="button" class="btn btn-outline-primary btn-sm" (click)="downloadPdf()">Download PDF</button>
      </div>

      <div *ngIf="!snapshot.items.length" class="text-muted">
        No revised quotation data yet. Click “Generate Revised Quotation” from Material Estimate to populate this view.
      </div>

      <div *ngIf="snapshot.items.length" class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Description</th>
              <th class="text-end">Amount (₹)</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of summaryRows">
              <td>{{ row[0] }}</td>
              <td class="text-end fw-semibold">₹ {{ row[1] }}</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <th>Final Total</th>
              <th class="text-end">₹ {{ snapshot.total | number: '1.0-2' }}</th>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>
</div>
