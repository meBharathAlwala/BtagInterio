<form #contactForm (ngSubmit)="onSubmit(contactForm)">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" name="user_name" class="form-control" placeholder="Your name" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="user_email" class="form-control" placeholder="you@example.com" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input type="tel" name="user_phone" class="form-control" placeholder="Your phone number" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Message</label>
    <textarea name="message" class="form-control" rows="5" placeholder="Tell us about your project location and total sqft and all details" required></textarea>
  </div>
  <button type="submit" class="btn btn-primary btn-lg" [disabled]="sending()">
    {{ sending() ? 'Sending...' : 'Send Message' }}
  </button>
  <p class="mt-3 text-success" *ngIf="status() === 'success'">Thanks! Your message has been sent.</p>
  <p class="mt-3 text-danger" *ngIf="status() === 'error'">Something went wrong. Please try again or email us directly.</p>
</form>
