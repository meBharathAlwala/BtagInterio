<section class="page-section fade-in">
  <div class="container py-5">
    <div class="text-center mb-5">
      <h2 class="display-6">Services</h2>
      <p class="text-muted">Full-service interior design solutions for residential and commercial clients.</p>
    </div>

    <div class="row g-4">
      <div class="col-md-4" *ngFor="let category of categories; let i = index">
        <div class="card shadow-sm border-0 service-card p-4 h-100" [style.animation-delay]="(i * 0.12) + 's'">
          <h5>{{ category.name }}</h5>
          <p class="text-muted mb-3">{{ category.description }}</p>
          <ul class="service-type-list mb-0">
            <li *ngFor="let type of category.types">{{ type }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
